[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# There is no router — every URL the app produces is "/". The catch-all is here
# so a stale bookmark or a typo'd path renders the app instead of a 404.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "no-referrer"
    X-Frame-Options        = "SAMEORIGIN"

# Vite fingerprints these filenames, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
